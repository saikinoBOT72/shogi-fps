<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>将棋FPS</title>
</head>
<body>
<div id="hud">
  <div id="lowhp"></div><div id="hurt"></div><div id="dashfx"></div>
  <div id="dds"></div>
  <div id="scope"></div>
  <div id="drawRing"></div>
  <div id="xh"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="dot"></i></div>
  <div id="hm"><i></i><i></i><i></i><i></i></div>
  <div id="reloadTxt" class="shadow">RELOADING</div>
  <div id="top" class="shadow">
    <div id="timer">90</div>
    <div id="foeWrap"><div id="foeTag">歩</div><div id="foeBar" class="bar"><div class="lag"></div><div class="fill"></div></div></div>
  </div>
  <div id="me" class="shadow">
    <div id="meHpNum">80<small>/80</small></div>
    <div id="meBar" class="bar"><div class="lag"></div><div class="fill"></div></div>
    <div id="meName"></div>
  </div>
  <div id="skill" class="shadow">
    <span id="skillName"></span>
    <div class="ring">
      <svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="23" fill="rgba(0,0,0,.4)" stroke="rgba(255,255,255,.2)" stroke-width="4"/>
        <circle id="skillArc" cx="27" cy="27" r="23" fill="none" stroke="#7ee0ff" stroke-width="4" stroke-dasharray="144.5" stroke-dashoffset="0"/></svg>
      <div class="key">E</div>
    </div>
  </div>
  <div id="wep" class="shadow">
    <div id="ammoNum">12<small>/12</small></div>
    <div id="pips"></div>
    <div id="wepName"></div>
  </div>
  <div id="center" class="shadow"></div>
  <div id="hint">F フルスクリーン ／ ESC 一時停止</div>
</div>
<div id="overlay"></div>
<div id="fps"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
