<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>将棋FPS</title>
<!-- 文字：駒の名前・ロゴはしっぽり明朝、画面の字は Zen Kaku Gothic New（Google Fonts。読み込めないときは PC の游明朝・游ゴシック） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
</head>
<body>
<div id="hud">
  <div id="lowhp"></div><div id="hurt"></div><div id="dashfx"></div>
  <div id="dds"></div>
  <div id="scope"></div>
  <div id="drawRing"></div>
  <div id="xh"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="dot"></i></div>
  <div id="hm"><i></i><i></i><i></i><i></i></div>
  <div id="cdBar"><i></i></div>
  <div id="reloadTxt" class="shadow">RELOADING</div>
  <div id="top" class="shadow">
    <div id="foeWrap"><div id="foeTag">歩</div><div id="foeBar" class="bar"><div class="lag"></div><div class="fill"></div></div></div>
  </div>
  <div id="me" class="shadow">
    <div id="meHpNum">80<small>/80</small></div>
    <div id="meBar" class="bar"><div class="lag"></div><div class="fill"></div></div>
    <div id="meName"></div>
  </div>
  <div id="skill" class="shadow"></div>
  <div id="wep" class="shadow">
    <div id="ammoNum">12<small>/12</small></div>
    <div id="pips"></div>
    <div id="wepName"></div>
  </div>
  <div id="center" class="shadow"></div>
  <div id="hint">F フルスクリーン ／ ESC 一時停止</div>
</div>
<div id="overlay"></div>
<div id="fps"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
